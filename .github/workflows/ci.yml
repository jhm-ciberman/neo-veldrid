name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The samples' AssetProcessor runs during the build and loads Assimp through
      # Silk.NET's default loader, which can't find NuGet-packaged native libraries
      # on Linux. Expose them via LD_LIBRARY_PATH for the build step only, so the
      # tests still exercise NeoVeldrid's own native library loading.
      - name: Find native library paths (Linux)
        id: native-paths
        if: runner.os == 'Linux'
        run: |
          dotnet restore NeoVeldrid.slnx
          NATIVE_PATHS=$(find ~/.nuget/packages -path "*/runtimes/linux-x64/native" -type d 2>/dev/null | tr '\n' ':')
          echo "paths=${NATIVE_PATHS}" >> $GITHUB_OUTPUT

      - name: Build
        run: dotnet build NeoVeldrid.slnx -c Release
        env:
          LD_LIBRARY_PATH: ${{ steps.native-paths.outputs.paths }}

      - name: Run SPIRV tests
        run: dotnet test --project tests/NeoVeldrid.SPIRV.Tests/NeoVeldrid.SPIRV.Tests.csproj -c Release

      - name: Run non-GPU tests
        run: dotnet test --project tests/NeoVeldrid.Tests/NeoVeldrid.Tests.csproj -c Release -p:ExcludeGPU=true
